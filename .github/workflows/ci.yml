name: CI

on:
  push:
    branches:
      - main
      - fix/p2-engineering-and-release
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore SlcMinecraftLaunch.slnx
          dotnet restore tests\SlcMinecraftLaunch.Tests\SlcMinecraftLaunch.Tests.csproj

      - name: Build solution
        run: dotnet build SlcMinecraftLaunch.slnx -c Release --no-restore

      - name: Build core tests
        run: dotnet build tests\SlcMinecraftLaunch.Tests\SlcMinecraftLaunch.Tests.csproj -c Release --no-restore

      - name: Test core
        run: dotnet test tests\SlcMinecraftLaunch.Tests\SlcMinecraftLaunch.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core-tests.trx"

      - name: Test WPF
        run: dotnet test tests\SlcMinecraftLaunch.Wpf.Tests\SlcMinecraftLaunch.Wpf.Tests.csproj -c Release --no-build --logger "trx;LogFileName=wpf-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/*.trx
          if-no-files-found: ignore
